pluginManagement {
  repositories {
    gradlePluginPortal()
    maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    maven { name = 'ParchmentMC';    url = 'https://maven.parchmentmc.org' }
  }
}

plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'industrialtech'

include 'Nova-Core', 'Nova_UI'
project(':Nova-Core').projectDir = file('modules/Nova-Core')
project(':Nova_UI').projectDir   = file('modules/Nova_UI')